<section id="clients" class="clients section-padding">
  <div class="container container-center">
    {{ if .Params.clients.headline }}<h4 class="category-title" style="text-align: center; margin-bottom: 0.5rem;">{{ .Params.clients.headline }}</h4>{{ end }}
    <h2>{{ .Params.clients.title | safeHTML }}</h2>
    <div class="grid testimonials-grid mt-4" style="text-align: left;">
      {{ range .Params.clients.items }}
      <div class="card testimonial-card">
        <p class="quote">"{{ .quote }}"</p>
        <div class="testimonial-author mt-4">
          <strong>{{ .author }}</strong><br>
          <span class="mono accent" style="font-size: 0.9rem;">{{ .role }}</span>
        </div>
      </div>
      {{ end }}
    </div>
  </div>
</section>
