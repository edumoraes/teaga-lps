<section id="services" class="services">
  <div class="container services-header">
    <h2 class="hero-title">O que fazemos de melhor</h2>
  </div>
  <div class="container">
    {{ range .Params.services }}
      <h2 class="category-title">— {{ .category }}</h2>
      <div class="services-grid mb-5">
        {{ range .items }}
        <div class="service-card">
          <div class="service-icon">{{ .icon }}</div>
          <h3>{{ .title }}</h3>
          <p>Estratégia, execução e análise avançada dentro do ecossistema {{ .category }}. Foco absoluto em conversão e crescimento escalável da sua receita.</p>
        </div>
        {{ end }}
      </div>
    {{ end }}
  </div>
</section>
