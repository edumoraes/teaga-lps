<section class="hero">
  <div class="container hero-content">
    <h1 class="hero-title">{{ .Params.hero.title | safeHTML }}</h1>
    <p class="hero-subtitle">{{ .Params.hero.subtitle }}</p>
    <div>
      <a href="{{ .Params.hero.button_link }}" class="btn btn-primary btn-large">{{ .Params.hero.button_text }}</a>
      <a href="{{ .Params.hero.secondary_button_link }}" class="btn btn-outline btn-large" style="margin-left: 1rem;">{{ .Params.hero.secondary_button_text }}</a>
    </div>

  </div>
</section>
